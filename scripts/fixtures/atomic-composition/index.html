<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Lantern harbor</title>
<style>body{font:16px system-ui;background:#142337;color:#f4e8d4;padding:18px;margin:0}img{width:100%;max-height:280px;object-fit:contain}button,input{font:inherit;padding:8px}label{display:block;margin:12px 0}</style>
<h1>Lantern harbor</h1><img src="harbor.svg" alt="A lighthouse above a quiet harbor">
<label>Work note <input id="note"></label><button id="signal">Send signal</button> <output id="count">0</output>
<button id="lamp">Select lamp</button>
<script>
spellcast.ready.then(state => {
  const count = document.querySelector('#count'), note = document.querySelector('#note');
  const render = value => { count.value = String(value.count ?? 0); note.value = value.note ?? ''; };
  render(state); spellcast.onRestore(render);
  note.oninput = () => spellcast.setState({note: note.value});
  document.querySelector('#signal').onclick = () => { const next = Number(count.value) + 1; count.value = String(next); spellcast.setState({count: next}); };
  document.querySelector('#lamp').onclick = () => spellcast.select({kind:'item',ids:['lamp'],label:'Lighthouse lamp'});
});
</script></html>
