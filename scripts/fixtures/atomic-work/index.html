<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Atomic canvas test work</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: #202532; color: #f4f1ea; font: 14px/1.45 system-ui, sans-serif; }
  .fixture-label { margin: 0 0 12px; color: #a8c8c0; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  h1 { margin: 0 0 16px; font-size: 22px; line-height: 1.2; }
  label { display: grid; gap: 7px; margin-bottom: 16px; color: #c5d2d0; font-size: 12px; font-weight: 600; }
  input { width: 100%; min-width: 0; padding: 10px 12px; border: 1px solid #596478; border-radius: 9px; background: #151b27; color: #f4f1ea; font: inherit; }
  .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  button { min-height: 36px; padding: 7px 12px; border: 1px solid #748099; border-radius: 9px; background: #2b3445; color: #f4f1ea; font: 600 12px/1.2 system-ui, sans-serif; cursor: pointer; }
  button:hover { background: #38445a; }
  #increment { border-color: #7ee0c8; background: #7ee0c8; color: #10231e; }
  #increment:hover { background: #a0ecd9; }
  :is(button, input):focus-visible { outline: 2px solid #d4b3ff; outline-offset: 2px; }
  #count { min-width: 30px; padding: 5px 7px; border-radius: 7px; background: #111923; color: #a5ebd8; font-variant-numeric: tabular-nums; text-align: center; }
  #spacer { height: 500px; margin-top: 18px; padding-top: 12px; border-top: 1px solid #465165; color: #aab8c4; font-size: 12px; }
</style>
<p class="fixture-label">Spellcast interaction test</p>
<h1>Native inline work</h1>
<label>Work note <input id="note" aria-label="Work note"></label>
<div class="actions"><button id="increment">Increase count</button><output id="count">0</output><button id="select">Select count</button></div>
<div id="spacer">Scroll inside this work.</div>
<script>
spellcast.ready.then(state => {
  const note = document.querySelector('#note'), count = document.querySelector('#count');
  const render = state => { note.value = state.note ?? ''; count.value = String(state.count ?? 0); };
  render(state); spellcast.onRestore(render);
  note.oninput = () => spellcast.setState({ note: note.value });
  document.querySelector('#increment').onclick = () => { const next = Number(count.value) + 1; count.value = String(next); spellcast.setState({ count: next }); };
  document.querySelector('#select').onclick = () => spellcast.select({ kind: 'item', ids: ['count'], label: 'Count' });
});
</script></html>
