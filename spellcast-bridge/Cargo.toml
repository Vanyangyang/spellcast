[package]
name = "spellcast-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared Spellcast state with a local REST adapter for the desktop and web preview"

[dependencies]
spellcast-core = { path = "../spellcast-core" }
serde.workspace = true
# Saved trials are recomputed on the server; floats must parse exactly as the client serialized them.
serde_json = { workspace = true, features = ["float_roundtrip"] }
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "sync", "time", "net", "process", "io-util"] }
axum = { version = "0.7.9", features = ["json", "query"] }
tower-http = { version = "0.6.2", features = ["cors"] }
tracing = "0.1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
rmcp = { version = "3.2.0", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
sha2 = "0.10.9"
uuid.workspace = true

# Sigil checks: a kill-on-close job for each command's process tree and OEM code page output.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

# Sigil checks: a process group for each command's process tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
