[workspace]

[package]
name = "spellcast"
version = "0.4.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Spellcast desktop shell — Windows and macOS"
rust-version = "1.88"

[lib]
name = "spellcast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.6", features = [] }
embed-resource = "3.0"

[dependencies]
spellcast-core = { path = "../spellcast-core" }
spellcast-bridge = { path = "../spellcast-bridge" }
axum = { version = "0.7.9", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
uuid = { version = "=1.11.0", features = ["v4"] }
toml_edit = "0.25"
sha2 = "=0.10.9"
fs2 = "=0.4.3"
tauri = { version = "2.2.5", features = ["macos-private-api"] }
tauri-plugin-opener = "2.2.6"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "time", "net", "sync"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemInformation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSScreen"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
wry = { path = "../vendor/wry" }
