[workspace]

[package]
name = "spellcast"
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Spellcast desktop shell — Windows and macOS"
rust-version = "1.88"

[lib]
name = "spellcast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.6", features = [] }

[dependencies]
spellcast-core = { path = "../spellcast-core" }
spellcast-bridge = { path = "../spellcast-bridge" }
axum = { version = "0.7.9", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25"
tauri = { version = "2.2.5", features = ["macos-private-api"] }
tauri-plugin-opener = "2.2.6"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "time", "net", "sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSScreen"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
