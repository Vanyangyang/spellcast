[workspace]

[package]
name = "spellcast"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Spellcast desktop shell — Windows and macOS"
rust-version = "1.88"

[lib]
name = "spellcast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.6", features = [] }

[dependencies]
spellcast-core = { path = "../spellcast-core" }
spellcast-bridge = { path = "../spellcast-bridge" }
axum = { version = "0.7.9", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25"
tauri = { version = "2.2.5", features = ["macos-private-api"] }
tauri-plugin-opener = "2.2.6"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "time", "net"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
