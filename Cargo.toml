[workspace]
resolver = "2"
members = ["spellcast-core", "spellcast-bridge", "spellcast-server"]
exclude = ["src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "=1.11.0", features = ["v4", "serde"] }
