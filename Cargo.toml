[workspace]
resolver = "2"
members = ["orbit-core", "orbit-server"]
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.83"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "=1.11.0", features = ["v4", "serde"] }
