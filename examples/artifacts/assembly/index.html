<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>把组成关系放进空间</title><link rel="stylesheet" href="./app.css"><style>#viewer{height:460px;border-radius:12px;overflow:hidden;touch-action:none}#viewer canvas{display:block;width:100%;height:100%}.parts{display:grid;gap:8px}.parts button{text-align:left}.parts button[aria-pressed=true]{background:#f5dfa8;border-color:#cdab61}</style></head><body>
<header><div class="eyebrow">04 / Assembly atlas</div><h1>把组成关系放进空间</h1><p>这是一台简化的环境观测装置。旋转视角、拆开组件，选中一个部件后继续讨论它的作用。</p></header>
<main class="grid"><section class="card"><div id="viewer" role="img" aria-label="可旋转的环境观测装置三维装配"></div><div class="bar"><button id="front">正面</button><button id="side">侧面</button><button id="isometric">透视</button><button id="fit">适应模型</button></div><p id="model-status" class="muted">正在读取 glTF 模型…</p></section>
<aside class="card"><label>装配展开 <output id="amount">0%</output><input id="explode" type="range" min="0" max="100" step="1" value="0"></label><h2 style="font-size:17px">选择一个部件</h2><div class="parts" id="parts"></div><p id="part-detail" aria-live="polite"></p><p class="muted">拖动旋转，滚轮缩放。视角、展开程度与部件选择会保留。这是自行生成的教学 GLB 模型，不含制造尺寸。</p></aside></main><script type="module" src="./app.js"></script></body></html>
