<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>把反馈落在时间上</title><link rel="stylesheet" href="./app.css"><style>video{display:block;width:100%;border-radius:12px;background:#e3ecea}audio{width:100%;margin:20px 0}.times{display:grid;grid-template-columns:1fr 1fr;gap:16px}#wave{width:100%;height:90px}.time-range{border-radius:10px;background:#e6f1ed;padding:12px;color:#30695d}</style></head><body>
<header><div class="eyebrow">06 / Time and sound</div><h1>把反馈落在时间上</h1><p>选择素材，再选择其中的一段。播放位置、循环范围与素材版本会一起保留。</p></header>
<main class="grid"><section class="card"><div class="bar"><label>当前素材<select id="asset"><option value="video">水的路径 · 视频</option><option value="audio">四个音符 · 音频</option></select></label></div><video id="video" src="./assets/water-route.mp4" playsinline preload="metadata"></video><div id="audio-wrap" hidden><svg id="wave" viewBox="0 0 600 90" aria-label="四个音符的时间示意波形"></svg><audio id="audio" src="./assets/four-notes.wav" preload="metadata"></audio></div><div class="bar"><button id="play" class="primary">播放</button><button id="pause">暂停</button><button id="loop">循环所选片段</button><output id="position">0.00 s</output></div><label>播放位置<input id="seek" type="range" min="0" max="8" step="0.05" value="0"></label></section>
<aside class="card"><h2 style="font-size:19px">选择要讨论的片段</h2><div class="times"><label>开始 / 秒<input id="start" type="number" min="0" max="8" step="0.1" value="1"></label><label>结束 / 秒<input id="end" type="number" min="0" max="8" step="0.1" value="3"></label></div><button id="select" class="primary">选择这段</button><p id="range" class="time-range" aria-live="polite">尚未选择时间段。</p><p id="error" class="error" aria-live="polite"></p><p class="muted">视频与四音符音频均由本地程序实际生成，共 8 秒。示意动画表达收集、过滤与储存的顺序，不是水流物理模拟。</p></aside></main><script type="module" src="./app.js"></script></body></html>
