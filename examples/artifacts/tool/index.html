<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雨水收集实验台</title><link rel="stylesheet" href="./app.css"></head><body>
<header><div class="eyebrow">07 / A custom little tool</div><h1>把“如果”变成可操作的实验</h1><p>改变屋顶面积、一次降雨量和收集效率，观察可收集水量、储水比例与溢出量。</p></header>
<main class="grid"><section class="card"><svg id="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" role="img" aria-label="屋顶与储水箱示意"><defs><linearGradient id="water" x2="0" y2="1"><stop stop-color="#80cfc0"/><stop offset="1" stop-color="#368775"/></linearGradient></defs><g id="roof" tabindex="0" role="button" aria-label="选择屋顶"><path d="M35 125L150 60L265 125Z" fill="#718e85"/><path d="M60 126H240V260H60Z" fill="#e5e9de"/><path d="M130 186H170V260H130Z" fill="#b6c9bd"/></g><path d="M266 130H314V175H355" fill="none" stroke="#9bb3ad" stroke-width="8"/><g id="tank" tabindex="0" role="button" aria-label="选择储水箱"><rect x="356" y="123" width="112" height="160" rx="15" fill="#e4efed" stroke="#88aaa0" stroke-width="2"/><rect id="water-level" x="361" y="278" width="102" height="0" fill="url(#water)" rx="9"/></g><text x="150" y="306" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#5c746d">收集屋顶</text><text x="412" y="306" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#5c746d">储水箱</text></svg>
<div class="bar"><div><div class="muted">收集量 / L</div><output id="collected" class="metric"></output></div><div style="margin-left:auto"><div class="muted">溢出量 / L</div><output id="overflow" class="metric"></output></div></div><p id="explanation" aria-live="polite"></p><div class="bar"><button id="csv">下载参数 CSV</button><button id="svg">下载示意 SVG</button></div></section>
<aside class="card"><label>屋顶面积 <output id="area-value"></output><input id="area" type="range" min="20" max="200" step="10" value="80"></label><label>一次降雨量 <output id="rain-value"></output><input id="rain" type="range" min="0" max="150" step="5" value="40"></label><label>收集效率 <output id="efficiency-value"></output><input id="efficiency" type="range" min="0" max="100" step="5" value="75"></label><label>储水箱容量 <output id="capacity-value"></output><input id="capacity" type="range" min="1000" max="10000" step="500" value="5000"></label><label>你的观察<textarea id="note" rows="3" maxlength="1000" placeholder="记录一个假设，或准备继续追问…"></textarea></label><p class="muted">体积 = 面积 × 降雨深度 × 效率。这里没有模拟蒸发、泄漏、时间分布或真实工程条件。</p></aside></main><script type="module" src="./app.js"></script></body></html>
