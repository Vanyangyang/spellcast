<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>摆长与周期</title><link rel="stylesheet" href="./app.css"></head><body>
<header><div class="eyebrow">03 / Mathematical instrument</div><h1>长度改变，节奏怎样改变？</h1><p>拖动参数，把公式和运动放在一起看。这个实验采用无摩擦、小角度单摆近似。</p></header>
<main class="grid"><section class="card"><svg id="pendulum" viewBox="0 0 500 380" role="img" aria-label="可调节长度的单摆"><path d="M100 44H400" stroke="#344b65" stroke-width="6"/><path id="arc" fill="none" stroke="#d6e3ed" stroke-width="2" stroke-dasharray="5 5"/><line id="rod" stroke="#72859a" stroke-width="4"/><circle cx="250" cy="48" r="6" fill="#344b65"/><circle id="bob" r="22" fill="#3c8875" tabindex="0" role="button" aria-label="选择摆锤"/></svg><div class="bar"><button id="play" class="primary">播放</button><button id="zero">回到起点</button><span id="phase" class="muted"></span></div></section>
<aside class="card"><label>摆长 <output id="length-label"></output><input id="length" type="range" min="0.2" max="3" step="0.1" value="1"></label><label>初始角度 <output id="angle-label"></output><input id="angle" type="range" min="5" max="15" step="1" value="12"></label><div id="formula" style="padding:18px 0;overflow:auto"></div><div class="muted">一次完整往返的时间</div><output id="period" class="metric"></output><p>周期随摆长的平方根增长；质量没有出现在这个近似式里。</p><p class="muted">g = 9.81 m/s²，角度限制在 15° 以内。真实大角度摆动、摩擦和空气阻力不在此模型中。</p></aside></main><script type="module" src="./app.js"></script></body></html>
