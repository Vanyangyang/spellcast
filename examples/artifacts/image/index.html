<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一张图，持续迭代</title><link rel="stylesheet" href="./app.css"><style>
.image-wrap{position:relative;border-radius:14px;overflow:hidden;touch-action:none;cursor:crosshair}.image-wrap img{display:block;width:100%;height:auto}.image-wrap .after,.image-wrap svg{position:absolute;inset:0;width:100%;height:100%}.image-wrap svg{pointer-events:none}.image-wrap line{stroke:white;stroke-width:2;filter:drop-shadow(0 0 3px #000)}.region-fields{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.region-fields label{font-size:11px}#comparison{flex:1;min-width:200px}
</style></head><body><header><div class="eyebrow">05 / Image conversation</div><h1>一张图，也可以继续共创</h1><p>你圈选的亭子已改为林间游泳池。原图、选区和对照位置均保留；选择“编辑版本”查看新结果，或拖动对照线比较。还可以圈出下一个想修改的区域。</p></header>
<main><div class="bar"><label>查看<select id="view"><option value="compare">前后对照</option><option value="original">原始图像</option><option value="amber">编辑版本</option></select></label><label id="comparison">对照位置<input id="split" type="range" min="0" max="100" value="50"></label><label id="target-label">反馈针对<select id="target"><option value="amber">游泳池版本</option><option value="original">原始玻璃屋顶</option></select></label></div>
<section class="card"><div class="image-wrap" id="image"><img src="./assets/pavilion-original.png" alt="雨水花园中带浅蓝绿色玻璃顶的木结构亭子" draggable="false"><img class="after" src="./assets/pavilion-amber.png" alt="亭子改为林间游泳池，保留周围植物、浅水与踏石" draggable="false"><svg viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"><line id="divider" x1="500" x2="500" y1="0" y2="1000"/><rect id="region" fill="#2b7bc433" stroke="#fff" stroke-width="3" stroke-dasharray="8 5"/></svg></div><p id="region-info" aria-live="polite"></p>
<div class="region-fields"><label>左侧 / %<input id="x" type="number" min="0" max="99" value="20"></label><label>顶部 / %<input id="y" type="number" min="0" max="99" value="15"></label><label>宽度 / %<input id="w" type="number" min="1" max="100" value="60"></label><label>高度 / %<input id="h" type="number" min="1" max="100" value="40"></label></div><div class="bar"><button id="apply" class="primary">选择这个区域</button><button id="clear">清除选区</button></div></section>
<p class="muted">原图与游泳池编辑版均由内置 ImageGen 实际生成并保存。AI 概念插画，不是现场照片或施工图；素材来源、上一版琥珀屋顶图和生成提示词保存在作品文件中。</p></main><script type="module" src="./app.js"></script></body></html>
