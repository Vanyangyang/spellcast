name: Release desktop app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        type: string
        required: true
      target:
        description: Platform to rebuild
        type: choice
        required: true
        default: all
        options: [all, windows, macos-arm64, macos-x64, linux]
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.target != 'all') && format('["{0}"]', inputs.target) || '["windows","macos-arm64","macos-x64","linux"]') }}

    runs-on: ${{ startsWith(matrix.target, 'macos') && 'macos-latest' || matrix.target == 'linux' && 'ubuntu-latest' || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS targets for the active repository toolchain
        if: runner.os == 'macOS'
        run: |
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run prepare:codex-plugin
      - run: npm run build
      - run: cargo test --workspace
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Spellcast ${{ inputs.tag || github.ref_name }}
          generateReleaseNotes: true
          releaseDraft: true
          args: ${{ matrix.target == 'macos-arm64' && '--target aarch64-apple-darwin --bundles dmg' || matrix.target == 'macos-x64' && '--target x86_64-apple-darwin --bundles dmg' || matrix.target == 'linux' && '--bundles appimage,deb' || '--bundles nsis' }}
