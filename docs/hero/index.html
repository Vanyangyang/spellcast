<!doctype html>
<!-- README hero: wand → idea → inspiration → fireworks. Render with `node docs/hero/render.mjs`. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1000, initial-scale=1" />
    <title>Spellcast</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1000px;
        height: 436px;
        overflow: hidden;
        background: #07080c;
        color: #f4f1ea;
        font-family: Inter, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        caret-color: transparent;
      }

      #stage {
        position: relative;
        width: 1000px;
        height: 436px;
        background: #07080c;
      }

      .rail {
        position: absolute;
        left: 40px;
        right: 40px;
        top: 26px;
        height: 1px;
        background: rgba(244, 241, 234, 0.1);
      }

      .dots {
        position: absolute;
        left: 40px;
        right: 40px;
        top: 20px;
        display: flex;
        justify-content: space-between;
        pointer-events: none;
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 1.5px solid rgba(244, 241, 234, 0.28);
        background: #07080c;
        box-sizing: border-box;
      }

      .dot.on {
        border-color: #f0c36a;
        background: #f0c36a;
        box-shadow: 0 0 10px rgba(240, 195, 106, 0.45);
      }

      .dot.done {
        border-color: #f0c36a;
        background: #f0c36a;
        box-shadow: none;
      }

      .title {
        position: absolute;
        left: 40px;
        top: 48px;
        margin: 0;
        font-size: 34px;
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 1;
        background: linear-gradient(100deg, #fff8ee 0%, #e3c8ff 40%, #ffd27a 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .caption {
        position: absolute;
        left: 40px;
        bottom: 22px;
        margin: 0;
        font-size: 13px;
        letter-spacing: 0.01em;
        color: rgba(244, 241, 234, 0.34);
      }

      .caption b {
        font-weight: 600;
        color: #f0c36a;
      }

      .caption .sep {
        display: inline-block;
        width: 5px;
        height: 5px;
        margin: 0 8px 1px 7px;
        border-right: 1.5px solid rgba(244, 241, 234, 0.28);
        border-top: 1.5px solid rgba(244, 241, 234, 0.28);
        transform: rotate(45deg);
        vertical-align: middle;
      }

      .layer {
        position: absolute;
        inset: 0;
        opacity: 0;
      }

      /* Wand */
      .wand-wrap {
        position: absolute;
        left: 92px;
        top: 248px;
        width: 180px;
        height: 120px;
        transform-origin: 18px 96px;
      }

      .wand-svg {
        display: block;
        overflow: visible;
      }

      .card {
        position: absolute;
        width: 188px;
        padding: 12px 16px 14px;
        border-radius: 12px;
        background: #f3efe4;
        color: #1b1820;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      }

      .card .k {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8a7040;
      }

      .card .k svg {
        display: block;
      }

      .card p {
        margin: 0;
        font-size: 15px;
        line-height: 1.35;
        letter-spacing: 0.01em;
        word-spacing: 0.06em;
      }

      /* Idea / bulb */
      .center {
        position: absolute;
        left: 50%;
        top: 54%;
        width: 0;
        height: 0;
      }

      .halo {
        position: absolute;
        left: -64px;
        top: -64px;
        width: 128px;
        height: 128px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 220, 120, 0.34) 0%, rgba(255, 220, 120, 0) 68%);
      }

      .spark {
        position: absolute;
        left: -8px;
        top: -8px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff4c8;
        box-shadow: 0 0 18px 6px rgba(255, 220, 120, 0.55);
      }

      .bulb {
        position: absolute;
        left: -28px;
        top: -36px;
        width: 56px;
        height: 72px;
      }

      .burst {
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
      }

      .ember {
        position: absolute;
        width: 5px;
        height: 5px;
        margin: -2.5px 0 0 -2.5px;
        border-radius: 50%;
      }

    </style>
  </head>
  <body>
    <div id="stage">
      <div class="rail"></div>
      <div class="dots" aria-hidden="true">
        <span class="dot" data-i="0"></span>
        <span class="dot" data-i="1"></span>
        <span class="dot" data-i="2"></span>
        <span class="dot" data-i="3"></span>
      </div>
      <h1 class="title">Spellcast</h1>
      <p class="caption" id="caption"></p>

      <div class="layer" id="wand-layer">
        <div class="wand-wrap" id="wand">
          <svg class="wand-svg" width="180" height="120" viewBox="0 0 180 120">
            <g transform="rotate(-34 16 104)">
              <rect x="8" y="99" width="108" height="10" rx="5" fill="#efe8d8" />
              <circle cx="42" cy="104" r="4.2" fill="#6b5340" />
              <circle cx="56" cy="104" r="4.2" fill="#6b5340" />
              <circle cx="70" cy="104" r="4.2" fill="#6b5340" />
              <circle cx="126" cy="104" r="12" fill="#c8b6f2" />
              <circle cx="126" cy="104" r="4.5" fill="#f4f1ea" />
            </g>
          </svg>
        </div>
        <article class="card" data-card="0">
          <div class="k">
            <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
              <path fill="#d4a017" d="M5 0.6 6.1 3.7 9.4 3.9 6.9 6.1 7.7 9.4 5 7.7 2.3 9.4 3.1 6.1 0.6 3.9 3.9 3.7Z" />
            </svg>
            A take
          </div>
          <p>Star this for Canvas</p>
        </article>
        <article class="card" data-card="1">
          <div class="k">
            <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
              <path fill="#d4a017" d="M5 0.6 6.1 3.7 9.4 3.9 6.9 6.1 7.7 9.4 5 7.7 2.3 9.4 3.1 6.1 0.6 3.9 3.9 3.7Z" />
            </svg>
            A take
          </div>
          <p>Keep the HUD still</p>
        </article>
        <article class="card" data-card="2">
          <div class="k">
            <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
              <path fill="#d4a017" d="M5 0.6 6.1 3.7 9.4 3.9 6.9 6.1 7.7 9.4 5 7.7 2.3 9.4 3.1 6.1 0.6 3.9 3.9 3.7Z" />
            </svg>
            A take
          </div>
          <p>Roast the spike timing</p>
        </article>
      </div>

      <div class="layer" id="idea-layer">
        <div class="center">
          <div class="halo" id="idea-halo"></div>
          <div class="spark" id="idea-spark"></div>
        </div>
      </div>

      <div class="layer" id="bulb-layer">
        <div class="center">
          <div class="halo" id="bulb-halo"></div>
          <svg class="bulb" id="bulb" viewBox="0 0 56 72" aria-hidden="true">
            <circle cx="28" cy="26" r="18" fill="#ffd65a" />
            <path d="M20 42c1.4 4 3.4 7 8 7s6.6-3 8-7" fill="#ffd65a" />
            <rect x="24" y="49" width="8" height="6" rx="1.6" fill="#3c3a46" />
            <rect x="23" y="55" width="10" height="3.2" rx="1.2" fill="#2a2832" />
          </svg>
        </div>
      </div>

      <div class="layer" id="fire-layer">
        <div class="center">
          <div class="burst" id="burst"></div>
        </div>
      </div>
    </div>
    <script>
      const DURATION = 6300;
      const STEPS = ["wand", "idea", "inspiration", "fireworks"];
      const CARD_HOME = [
        { x: 368, y: 156 },
        { x: 598, y: 96 },
        { x: 778, y: 198 },
      ];
      const ORIGIN = { x: 184, y: 286 };
      const COLORS = ["#fff6d8", "#f0c36a", "#d4b3ff", "#7ee0c8", "#f4f1ea"];

      const embers = Array.from({ length: 16 }, (_, i) => {
        const a = (i / 16) * Math.PI * 2 + (i % 3) * 0.11;
        const dist = 54 + (i % 4) * 16;
        return { a, dist, color: COLORS[i % COLORS.length], size: 6 + (i % 3) };
      });

      const burst = document.getElementById("burst");
      for (const e of embers) {
        const n = document.createElement("div");
        n.className = "ember";
        n.style.background = e.color;
        n.style.width = n.style.height = e.size + "px";
        burst.appendChild(n);
      }

      const $ = (id) => document.getElementById(id);
      const dots = [...document.querySelectorAll(".dot")];
      const cards = [...document.querySelectorAll("[data-card]")];
      const caption = $("caption");

      function clamp(v, a, b) {
        return Math.max(a, Math.min(b, v));
      }
      function range(t, a, b) {
        return clamp((t - a) / (b - a), 0, 1);
      }
      function easeOut(t) {
        return 1 - (1 - t) ** 3;
      }

      function sceneIndex(t) {
        if (t < 1900) return 0;
        if (t < 3300) return 1;
        if (t < 4700) return 2;
        return 3;
      }

      function apply(t) {
        t = ((t % DURATION) + DURATION) % DURATION;
        const scene = sceneIndex(t);

        dots.forEach((d, i) => {
          d.classList.toggle("on", i === scene);
          d.classList.toggle("done", i < scene);
        });

        caption.innerHTML = STEPS.map((name, i) => {
          const word = i === scene ? `<b>${name}</b>` : name;
          return i ? `<span class="sep"></span>${word}` : word;
        }).join("");

        const wandVis = t < 2000 ? 1 - range(t, 1760, 2000) : 0;
        $("wand-layer").style.opacity = String(wandVis);
        const wandIn = easeOut(range(t, 80, 420));
        $("wand").style.transform = `rotate(${-8 + wandIn * 10}deg)`;
        cards.forEach((card, i) => {
          const start = 280 + i * 220;
          const p = easeOut(range(t, start, start + 520));
          const x = ORIGIN.x + (CARD_HOME[i].x - ORIGIN.x) * p;
          const y = ORIGIN.y + (CARD_HOME[i].y - ORIGIN.y) * p - Math.sin(p * Math.PI) * 18;
          card.style.left = x + "px";
          card.style.top = y + "px";
          card.style.opacity = String(p);
          card.style.transform = `scale(${0.72 + 0.28 * p})`;
        });

        const ideaVis = t >= 1760 && t < 3480 ? (t < 2000 ? range(t, 1760, 2000) : 1 - range(t, 3240, 3480)) : 0;
        $("idea-layer").style.opacity = String(ideaVis);
        const ideaGrow = easeOut(range(t, 1900, 2500));
        $("idea-spark").style.transform = `scale(${0.35 + ideaGrow * 1.15})`;
        $("idea-halo").style.opacity = String(0.35 + ideaGrow * 0.65);
        $("idea-halo").style.transform = `scale(${0.55 + ideaGrow * 0.7})`;

        const bulbVis = t >= 3240 && t < 4740 ? (t < 3480 ? range(t, 3240, 3480) : 1 - range(t, 4660, 4740)) : 0;
        $("bulb-layer").style.opacity = String(bulbVis);
        const pulse = 1 + Math.sin(range(t, 3480, 4680) * Math.PI) * 0.12;
        $("bulb").style.transform = `scale(${0.88 + 0.14 * easeOut(range(t, 3300, 3700))})`;
        $("bulb-halo").style.transform = `scale(${pulse})`;
        $("bulb-halo").style.opacity = String(0.45 + 0.55 * Math.sin(range(t, 3480, 4680) * Math.PI));

        const fireVis = t >= 4680 ? range(t, 4680, 4840) * (1 - range(t, 6000, 6300)) : 0;
        $("fire-layer").style.opacity = String(fireVis);
        const burstP = easeOut(range(t, 4700, 5750));
        [...burst.children].forEach((node, i) => {
          const e = embers[i];
          const r = e.dist * burstP;
          node.style.transform = `translate(${Math.cos(e.a) * r}px, ${Math.sin(e.a) * r}px)`;
          node.style.opacity = String(1 - range(t, 5450, 6200));
        });
      }

      window.__seek = apply;
      window.__DURATION = DURATION;

      const params = new URLSearchParams(location.search);
      if (params.has("t")) {
        apply(Number(params.get("t")) || 0);
      } else {
        const start = performance.now();
        const tick = (now) => {
          apply(now - start);
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }
    </script>
  </body>
</html>
