<!doctype html>
<!-- README hero: wand casts aside bubbles. Render with `node docs/hero/render.mjs`. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1000, initial-scale=1" />
    <title>Spellcast</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1000px;
        height: 436px;
        overflow: hidden;
        background: #07080c;
        color: #f4f1ea;
        font-family: Inter, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        caret-color: transparent;
      }

      #stage {
        position: relative;
        width: 1000px;
        height: 436px;
        background: #07080c;
      }

      .title {
        position: absolute;
        left: 40px;
        top: 36px;
        margin: 0;
        font-size: 34px;
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 1;
        background: linear-gradient(100deg, #fff8ee 0%, #e3c8ff 40%, #ffd27a 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .wand-wrap {
        position: absolute;
        left: 92px;
        top: 236px;
        width: 180px;
        height: 120px;
        transform-origin: 18px 96px;
      }

      .wand-svg {
        display: block;
        overflow: visible;
      }

      .card {
        position: absolute;
        width: 188px;
        padding: 12px 16px 14px;
        border-radius: 12px;
        background: #f3efe4;
        color: #1b1820;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      }

      .card .k {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8a7040;
      }

      .card .k svg {
        display: block;
      }

      .card p {
        margin: 0;
        font-size: 15px;
        line-height: 1.35;
        letter-spacing: 0.01em;
        word-spacing: 0.06em;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <h1 class="title">Spellcast</h1>
      <div class="wand-wrap" id="wand">
        <svg class="wand-svg" width="180" height="120" viewBox="0 0 180 120">
          <g transform="rotate(-34 16 104)">
            <rect x="8" y="99" width="108" height="10" rx="5" fill="#efe8d8" />
            <circle cx="42" cy="104" r="4.2" fill="#6b5340" />
            <circle cx="56" cy="104" r="4.2" fill="#6b5340" />
            <circle cx="70" cy="104" r="4.2" fill="#6b5340" />
            <circle cx="126" cy="104" r="12" fill="#c8b6f2" />
            <circle cx="126" cy="104" r="4.5" fill="#f4f1ea" />
          </g>
        </svg>
      </div>
      <article class="card" data-card="0">
        <div class="k">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <path fill="#d4a017" d="M5 0.6 6.1 3.7 9.4 3.9 6.9 6.1 7.7 9.4 5 7.7 2.3 9.4 3.1 6.1 0.6 3.9 3.9 3.7Z" />
          </svg>
          A take
        </div>
        <p>Star this for Canvas</p>
      </article>
      <article class="card" data-card="1">
        <div class="k">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <path fill="#d4a017" d="M5 0.6 6.1 3.7 9.4 3.9 6.9 6.1 7.7 9.4 5 7.7 2.3 9.4 3.1 6.1 0.6 3.9 3.9 3.7Z" />
          </svg>
          A take
        </div>
        <p>Keep the HUD still</p>
      </article>
      <article class="card" data-card="2">
        <div class="k">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <path fill="#d4a017" d="M5 0.6 6.1 3.7 9.4 3.9 6.9 6.1 7.7 9.4 5 7.7 2.3 9.4 3.1 6.1 0.6 3.9 3.9 3.7Z" />
          </svg>
          A take
        </div>
        <p>Roast the spike timing</p>
      </article>
    </div>
    <script>
      const DURATION = 4200;
      const CARD_HOME = [
        { x: 368, y: 148 },
        { x: 598, y: 88 },
        { x: 778, y: 190 },
      ];
      const ORIGIN = { x: 184, y: 274 };
      const cards = [...document.querySelectorAll("[data-card]")];
      const wand = document.getElementById("wand");

      function clamp(v, a, b) {
        return Math.max(a, Math.min(b, v));
      }
      function range(t, a, b) {
        return clamp((t - a) / (b - a), 0, 1);
      }
      function easeOut(t) {
        return 1 - (1 - t) ** 3;
      }

      function apply(t) {
        t = ((t % DURATION) + DURATION) % DURATION;
        const fade = 1 - range(t, 3600, 4000);
        const wandIn = easeOut(range(t, 60, 360));
        wand.style.opacity = String(fade);
        wand.style.transform = `rotate(${-8 + wandIn * 10}deg)`;
        cards.forEach((card, i) => {
          const start = 240 + i * 240;
          const p = easeOut(range(t, start, start + 480));
          const x = ORIGIN.x + (CARD_HOME[i].x - ORIGIN.x) * p;
          const y = ORIGIN.y + (CARD_HOME[i].y - ORIGIN.y) * p - Math.sin(p * Math.PI) * 18;
          card.style.left = x + "px";
          card.style.top = y + "px";
          card.style.opacity = String(p * fade);
          card.style.transform = `scale(${0.72 + 0.28 * p})`;
        });
      }

      window.__seek = apply;
      window.__DURATION = DURATION;

      const params = new URLSearchParams(location.search);
      if (params.has("t")) {
        apply(Number(params.get("t")) || 0);
      } else {
        const start = performance.now();
        const tick = (now) => {
          apply(now - start);
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }
    </script>
  </body>
</html>
