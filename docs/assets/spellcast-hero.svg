<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
  <title id="title">Spellcast — a stage of its own</title>
  <desc id="desc">A concept illustration of a desktop aside becoming three directions to explore on an everything board.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#191820"/><stop offset="1" stop-color="#30253f"/></linearGradient>
    <linearGradient id="bubble" x2=".8" y2="1"><stop stop-color="#d9c5f4"/><stop offset="1" stop-color="#bc9bdf"/></linearGradient>
  </defs>
  <rect width="1200" height="530" rx="24" fill="url(#bg)"/>
  <g fill="#eee8f4" font-family="Segoe UI,Arial,sans-serif">
    <text x="54" y="70" font-size="21" letter-spacing="2">SPELLCAST</text>
    <text x="54" y="167" font-size="53" font-weight="600">A stage of its own.</text>
    <text x="57" y="209" font-size="21" fill="#c5b9d0">Room for your AI to challenge, remember, and imagine.</text>
  </g>
  <rect x="57" y="279" width="333" height="126" rx="25" fill="url(#bubble)"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#2e203a">
    <text x="82" y="315" font-size="12" letter-spacing="1.4">A THOUGHT WORTH KEEPING</text>
    <text x="82" y="351" font-size="22">What if the rain</text>
    <text x="82" y="380" font-size="22">is the puzzle?</text>
  </g>
  <path d="M 411 341 C 452 341 437 282 481 282" fill="none" stroke="#af93cb" stroke-width="2"/>
  <path d="M 473 277 L 482 282 L 473 287" fill="none" stroke="#af93cb" stroke-width="2"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="500" y="256" width="643" height="214" rx="17" fill="#222027" stroke="#5a486d"/>
    <text x="523" y="286" font-size="12" fill="#c4a6df" letter-spacing="1.2">THE EVERYTHING BOARD</text>
    <text x="523" y="319" font-size="25" fill="#eee8f4">Let the rain lead the way.</text>
    <g fill="#302936" stroke="#60466e">
      <rect x="524" y="340" width="187" height="99" rx="9"/>
      <rect x="727" y="340" width="187" height="99" rx="9"/>
      <rect x="930" y="340" width="187" height="99" rx="9"/>
    </g>
    <g fill="#c3afd4" font-size="12">
      <text x="540" y="365">EXPLORE</text><text x="744" y="365">COMPARE</text><text x="947" y="365">DEVELOP</text>
    </g>
    <g fill="#f1eaf7" font-size="17">
      <text x="540" y="397">Follow a sound</text><text x="744" y="397">Decode a rhythm</text><text x="947" y="397">Find an old echo</text>
    </g>
  </g>
  <text x="58" y="466" font-size="16" fill="#d6c8e2" font-family="Segoe UI,Arial,sans-serif">Desktop asides. Ideas you can work with.</text>
  <text x="1050" y="502" font-size="11" fill="#b4a3c4" font-family="Segoe UI,Arial,sans-serif">Concept illustration</text>
</svg>
