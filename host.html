<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spellcast · 插件里的专注板</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="host">
      <aside class="editor">
        <header>
          <em>插件宿主</em>
          <span>Cursor / VS Code 侧栏就是这样嵌进来的</span>
        </header>
        <p class="blurb">
          Spellcast 不是聊天窗，也不接模型。专注板是<strong>呈现方式</strong>：空间碎片，不是一堵字。桌面气泡是你在别处干活时的辅助旁路。
        </p>
        <label for="selection">别处已经在进行的对话 / 选区</label>
        <textarea id="selection" rows="12">User: 我想做一块用空间碎片呈现的板
Assistant: 别再把点子收成一堵字。先选一种形式，把还没成形的交到板上。
User: Three.js 会不会只是形式的一种？
Assistant: 是。立体只是舞台之一。星散、时序、并置都该在板上。</textarea>
        <div class="actions">
          <button type="button" id="send-sel" class="primary">摊到专注板</button>
          <button type="button" id="import-sel" class="ghost">当对话拣碎片</button>
          <button type="button" id="reset-env" class="ghost">清空板</button>
        </div>
        <p class="hint">和扩展命令同一套协议：<code>orbit.utter</code> / <code>orbit.import</code></p>
        <section class="events">
          <header>板回传</header>
          <ol id="events"></ol>
        </section>
      </aside>
      <section class="env">
        <header>
          <span>专注板</span>
          <a href="/">单独打开</a>
        </header>
        <iframe id="orbit" title="Spellcast 专注板" src="/?embed=1"></iframe>
      </section>
    </div>
    <script type="module" src="/src/host.ts"></script>
  </body>
</html>
